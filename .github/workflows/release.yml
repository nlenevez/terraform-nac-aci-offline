name: release

# Push a tag (e.g. v2.1.0-1) -> build the airgap bundle, verify it offline
# (network namespace + RHEL 8 container), attach zip + sha256 to a Release.
# Run manually -> same build/verify, zip kept as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the zip carries full git history

      - name: Build
        run: scripts/build-bundle.sh

      - name: Verify offline (incl. RHEL 8 container)
        run: scripts/verify-bundle.sh dist/*.zip

      - name: Keep as artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: nac-aci-airgap
          path: dist/*
          compression-level: 0    # already a zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . bundle.env
          {
            echo "Offline nac-aci bundle for ${PLATFORMS}."
            echo
            echo "| Component | Version |"
            echo "|---|---|"
            echo "| Terraform | ${TF_VERSION} |"
            echo "| nac-aci module | ${MODULE_VERSION} |"
            awk -F'"' '/^provider/{p=$2} /^  version/{print "| " p " | " $2 " |"}' .terraform.lock.hcl \
              | sed 's#registry.terraform.io/##'
            echo
            echo '```'
            cat dist/*.sha256
            echo '```'
            echo
            echo 'Use: `sha256sum -c *.sha256 && unzip -q nac-aci-airgap-*.zip && cd nac-aci && ./airgap/setup.sh --install && terraform init`'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
            --title "nac-aci airgap $GITHUB_REF_NAME" --notes-file notes.md
